<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1020">
  <title>Rebate-Share · Demo</title>
  <meta name="description" content="Copy Trading mit Gold Evolution bei einem regulierten Broker. Einfacher Start. Es gibt ein Empfehlungsprogramm – Details nach dem Login.">
  <meta property="og:title" content="Rebate-Share">
  <meta property="og:description" content="Copy Trading mit Gold Evolution bei einem regulierten Broker. Einfacher Start. Es gibt ein Empfehlungsprogramm – Details nach dem Login.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch.png">
  <style>
:root {
  --bg: #06080f;
  --bg2: #0b1020;
  --card: rgba(16, 24, 42, .62);
  --card-solid: #10182a;
  --line: rgba(212, 179, 106, .16);
  --text: #f3efe6;
  --muted: #93a0b8;
  --gold: #e0c078;
  --gold-2: #f5e2b0;
  --emerald: #3ee0a0;
  --emerald-dim: rgba(62, 224, 160, .15);
  --red: #ff7a82;
  --blue: #8bb4ff;
  --warn: #ffc857;
  --radius: 20px;
  --shadow: 0 20px 60px rgba(0,0,0,.45);
  --glass: blur(18px) saturate(140%);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--text);
  min-height: 100vh;
  background:
    radial-gradient(900px 500px at 8% -10%, rgba(224,192,120,.16), transparent 55%),
    radial-gradient(800px 480px at 100% 0%, rgba(62,224,160,.08), transparent 50%),
    radial-gradient(700px 400px at 50% 120%, rgba(80,100,180,.12), transparent 50%),
    var(--bg);
  background-attachment: fixed;
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-2); }
.banner {
  position: relative; z-index: 5;
  background: linear-gradient(90deg, #2a210e, #1a2a22 70%);
  color: var(--gold-2);
  text-align: center; padding: 8px 16px; font-size: 12px;
  border-bottom: 1px solid rgba(224,192,120,.25);
}
.banner.impersonate { background: #10261c; color: var(--emerald); }
.banner.warn-over {
  background: linear-gradient(90deg, #3a1a12, #3a2a10);
  color: var(--warn); font-weight: 600;
}
.ticker {
  position: relative; z-index: 4;
  overflow: hidden; white-space: nowrap;
  border-bottom: 1px solid var(--line);
  background: rgba(6,8,15,.7);
  backdrop-filter: var(--glass);
  font-variant-numeric: tabular-nums;
  font-size: 12px; color: var(--muted);
  height: 32px; line-height: 32px;
}
.ticker-track { display: inline-block; padding-left: 100%; animation: ticker 28s linear infinite; }
.ticker b { color: var(--gold); font-weight: 600; margin: 0 6px 0 22px; }
.ticker .up { color: var(--emerald); }
@keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 68px); }
.topbar {
  display: none; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: rgba(8,10,18,.92); backdrop-filter: var(--glass);
  position: sticky; top: 0; z-index: 40;
}
.menu-btn { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
.menu-close { display: none; margin-left: auto; }
.side-head { display: flex; align-items: flex-start; gap: 8px; }
.side-head .brand { flex: 1; }
.sidebar {
  background: rgba(8, 12, 22, .78);
  backdrop-filter: var(--glass);
  border-right: 1px solid var(--line);
  padding: 22px 16px;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: calc(100vh - 68px);
}
.brand { display: flex; gap: 10px; align-items: center; color: var(--text); margin-bottom: 22px; }
.brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: .04em; }
.logo {
  width: 38px; height: 38px; border-radius: 12px;
  background: conic-gradient(from 210deg, #f5e2b0, #b8873a, #3ee0a0, #f5e2b0);
  color: #140e04; font-weight: 800; display: grid; place-items: center;
  box-shadow: 0 0 24px rgba(224,192,120,.35);
  flex-shrink: 0;
}
nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: auto; }
nav a { color: var(--muted); padding: 9px 12px; border-radius: 10px; font-weight: 500; transition: .2s ease; }
nav a:hover, nav a.on { background: rgba(224,192,120,.1); color: var(--text); }
nav a.on { box-shadow: inset 2px 0 0 var(--gold); }
.nav-label { margin: 18px 12px 6px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.side-foot { border-top: 1px solid var(--line); padding-top: 14px; }
.who { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #3ee0a0, #e0c078);
  color: #0a0c10; display: grid; place-items: center; font-weight: 700;
}
.lang { display: flex; gap: 6px; margin: 8px 0; }
.lang a, .lang button {
  color: var(--muted); border: 1px solid var(--line); border-radius: 7px;
  padding: 2px 8px; font-size: 12px; background: transparent; cursor: pointer;
}
.lang a.on, .lang button.on { border-color: var(--gold); color: var(--gold); }
.logout { color: var(--muted); font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer; }
.main { padding: 28px 32px 64px; max-width: 1180px; animation: fadeup .45s ease; }
@keyframes fadeup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; font-weight: 700; }
h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; letter-spacing: .02em; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  backdrop-filter: var(--glass);
  position: relative; overflow: hidden;
}
.card.narrow { max-width: 680px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi span { color: var(--muted); font-size: 12px; display: block; letter-spacing: .04em; text-transform: uppercase; }
.kpi strong { font-size: 24px; display: block; margin-top: 6px; letter-spacing: -.02em; }
.kpi small { font-size: 13px; color: var(--gold); font-weight: 500; }
.kpi.warn-kpi { border-color: rgba(255,200,87,.45); box-shadow: 0 0 0 1px rgba(255,200,87,.2), var(--shadow); }
.kpi.warn-kpi strong { color: var(--warn); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; line-height: 1.55; }
.mt { margin-top: 12px; }
.tag {
  display: inline-block; font-style: normal; font-size: 10px; letter-spacing: .1em;
  border: 1px solid var(--gold); color: var(--gold); padding: 2px 7px; border-radius: 999px;
  vertical-align: middle;
}
.tag.sm { font-size: 9px; padding: 1px 5px; }
.tag.gold { background: #2a2310; }
.pill { display: inline-block; background: rgba(255,255,255,.05); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
.copy-row { display: flex; gap: 8px; }
.copy-row input { flex: 1; }
input, select, button, textarea { font: inherit; color: var(--text); }
input, select, textarea {
  width: 100%; background: rgba(6,10,20,.7); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px;
}
input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
label { display: block; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
label input, label select, label textarea { margin-top: 6px; }
.btn, button.btn, form.stack button[type=submit], .stack > button {
  background: linear-gradient(180deg, #f0d792, #c9a24a);
  color: #16110a; border: 0; border-radius: 12px; padding: 10px 16px;
  font-weight: 700; cursor: pointer; display: inline-block;
  box-shadow: 0 8px 20px rgba(224,192,120,.2);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover, form.stack button[type=submit]:hover { transform: translateY(-1px); }
.btn.ghost, button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); box-shadow: none; }
.btn.sm, button.sm { padding: 6px 10px; font-size: 12px; border-radius: 9px; }
.btn.danger, button.danger { color: var(--red); border-color: #5a3038; background: transparent; box-shadow: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.flash { border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--line); background: rgba(28,38,64,.7); }
.flash.ok { border-color: rgba(62,224,160,.35); background: rgba(16,40,28,.7); color: var(--emerald); }
.flash.error { border-color: #5a3038; background: rgba(42,21,24,.7); color: var(--red); }
.flash.warn { border-color: #5a4a20; background: rgba(42,35,16,.7); color: var(--warn); }
.status { display: inline-block; padding: 6px 10px; border-radius: 999px; font-weight: 600; }
.status.ok { background: var(--emerald-dim); color: var(--emerald); }
.status.no { background: rgba(255,122,130,.12); color: var(--red); }
.status.sm { font-size: 12px; padding: 3px 8px; font-weight: 500; }
.status.pending, .status.requested { background: rgba(255,200,87,.12); color: var(--warn); }
.status.approved { background: rgba(139,180,255,.12); color: var(--blue); }
.status.paid, .status.sent, .status.approved { background: var(--emerald-dim); color: var(--emerald); }
.status.failed { background: rgba(255,80,80,.15); color: #ff8a8a; }
.status.rejected { background: rgba(255,122,130,.12); color: var(--red); }
.table-wrap { overflow: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, Consolas, monospace; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.facts { padding-left: 18px; }
.tree { list-style: none; margin: 0; padding-left: 18px; border-left: 1px dashed rgba(224,192,120,.3); }
.tree-node { padding: 7px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; animation: fadeup .5s ease; }
.tree-node.root { margin-bottom: 8px; }
.tree li { position: relative; }
.tree li::before {
  content: ""; position: absolute; left: -18px; top: 16px; width: 14px; height: 1px;
  background: rgba(224,192,120,.35);
}
.search { display: flex; gap: 8px; margin-bottom: 14px; max-width: 480px; }
.rates { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 0 0 12px; }
legend { color: var(--muted); padding: 0 6px; }
.check { display: flex; align-items: center; gap: 8px; color: var(--text); }
.check input { width: auto; }
.inline-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.inline-actions input[type=text] { width: 140px; padding: 6px 8px; }
.auth-wrap { max-width: 480px; margin: 48px auto 80px; padding: 0 16px; position: relative; z-index: 1; animation: fadeup .5s ease; }
.auth-top { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.auth-top .lang { margin-left: auto; }
.auth-card h1 { margin: 0 0 6px; }
.roles { display: grid; gap: 10px; margin-top: 16px; }
.role {
  text-align: left; width: 100%; background: rgba(8,12,22,.7); border: 1px solid var(--line);
  color: var(--text); padding: 14px 16px; border-radius: 14px; cursor: pointer;
  transition: border-color .2s, transform .15s;
}
.role:hover { border-color: var(--gold); transform: translateY(-1px); }
.role strong { display: block; font-size: 15px; }
.role span { color: var(--muted); font-size: 13px; font-weight: 400; }
.demo-box {
  margin-top: 18px; padding: 12px; border-radius: 12px; background: rgba(8,12,22,.6);
  border: 1px dashed var(--line); font-size: 13px; color: var(--muted); line-height: 1.6;
}
.demo-box strong { color: var(--gold); display: block; margin-bottom: 4px; }
.footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; line-height: 1.5; padding: 0 12px 24px; }
.fine { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 18px; }

/* ranks */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
}
.badge.starter { background: #1c2436; color: #c5d0e6; border: 1px solid #3a465e; }
.badge.bronze { background: #2a1c12; color: #e0a070; border: 1px solid #8a5a32; }
.badge.silver { background: #1c2228; color: #d7e0ea; border: 1px solid #8a98a8; }
.badge.gold { background: #2a210e; color: #f0d792; border: 1px solid #c9a24a; box-shadow: 0 0 16px rgba(224,192,120,.25); }
.badge.elite { background: linear-gradient(90deg, #14261c, #2a210e); color: #f5e2b0; border: 1px solid #3ee0a0; box-shadow: 0 0 18px rgba(62,224,160,.25); }
.badge.none { background: #1a1520; color: var(--muted); border: 1px solid var(--line); }
.bars { display: grid; gap: 8px; margin-top: 12px; }
.bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.06); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px;
  background: linear-gradient(90deg, #3ee0a0, #e0c078);
  box-shadow: 0 0 10px rgba(62,224,160,.4);
  transition: width 1s ease;
}
.chart { width: 100%; height: 180px; display: block; }
.scrim { display: none; }

@media (max-width: 980px) {
  /* nav stacking fix: do not trap the drawer in .shell's z-index context */
  .shell { grid-template-columns: 1fr; z-index: auto; }
  .topbar { display: flex; }
  .menu-close { display: inline-flex; }
  .sidebar {
    display: none; position: fixed; top: 0; left: 0; bottom: 0;
    width: min(280px, 90vw); height: 100%; z-index: 50;
    padding-top: 16px;
  }
  body.nav-open { overflow: hidden; }
  body.nav-open .sidebar { display: flex; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 45; }
  .kpis, .grid-2, .rates { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .main { padding: 16px 14px 80px; }
  .kpis, .grid-2, .rates { grid-template-columns: 1fr; }
  .page-head h1 { font-size: 22px; }
  .auth-wrap { margin: 20px auto 40px; }
}

/* public header */
.pub-head { display:flex; align-items:center; gap:14px; padding:16px 28px; position:sticky; top:0; z-index:30; background:rgba(6,8,15,.92); backdrop-filter:var(--glass); }
.pub-head .brand { margin-bottom:0; }
.pub-head nav { margin-left:auto; display:flex; flex-direction:row; gap:14px; align-items:center; flex-wrap:wrap; flex:none; overflow:visible; }
.pub-head nav a { color:var(--muted); font-weight:600; }
.pub-head nav a.btn { color:#16110a; }
.pub-menu-btn { display:none; margin-left:auto; }

/* landing */
.hero { padding:28px 28px 10px; display:grid; grid-template-columns: 1.1fr .9fr; gap:32px; align-items:center; max-width:1180px; margin:0 auto; position:relative; z-index:1; }
.hero h1 { font-size: clamp(36px, 6vw, 64px); line-height:1.05; margin:0 0 14px; letter-spacing:-.04em; }
.signal { display:inline-block; background:linear-gradient(90deg,#3ee0a0,#7dffc6); color:#062016; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:12px; padding:6px 12px; border-radius:999px; box-shadow:0 0 28px rgba(62,224,160,.45); margin-bottom:14px; }
.hero-sub { color:var(--muted); font-size:18px; line-height:1.5; max-width:34em; }
.hero-ctas { display:flex; gap:12px; flex-wrap:wrap; margin-top:22px; }
.phones { position:relative; height:420px; }
.phone { position:absolute; width:210px; height:400px; border-radius:32px; background:#0a101c; border:3px solid #2a3348; box-shadow: var(--shadow), 0 0 0 8px rgba(224,192,120,.08); overflow:hidden; padding:18px 12px; }
.phone:nth-child(1){ left:10px; top:10px; transform:rotate(-8deg); }
.phone:nth-child(2){ right:10px; top:30px; transform:rotate(7deg); }
.phone .notch { width:70px; height:8px; background:#1a2233; border-radius:8px; margin:0 auto 12px; }
.ph-kpi { background:rgba(16,24,42,.9); border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin-bottom:8px; }
.ph-kpi span{ font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.ph-kpi strong{ display:block; font-size:16px; color:var(--gold-2); }
.section { max-width:1180px; margin:0 auto; padding:48px 28px; position:relative; z-index:1; }
.steps3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.step-card { text-align:left; }
.step-num { color:var(--emerald); font-weight:800; font-size:22px; }
.faq details { border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:8px; background:var(--card); }
.faq summary { cursor:pointer; font-weight:600; }
.risk-box { border:1px solid rgba(255,122,130,.35); background:rgba(42,21,24,.55); border-radius:20px; padding:22px; }
.levels-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.lvl { text-align:center; padding:14px 8px; }
.lvl b { display:block; font-size:22px; color:var(--gold); }
.wizard { display:grid; gap:12px; }
.wizard-step { display:grid; grid-template-columns: 28px 1fr auto; gap:12px; align-items:center; }
.dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:11px; }
.dot.on { background:var(--emerald); border-color:var(--emerald); color:#062016; }
.team-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
.level-chips { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
.level-chips .chip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:12px; }
.tree-card { overflow:hidden; }
.team-canvas { --rail: 48px; border:1px solid var(--line); border-radius:16px; background:
  radial-gradient(circle at 20% 0%, rgba(224,192,120,.08), transparent 40%),
  linear-gradient(#0a1020, #070b16); position:relative; cursor:grab; touch-action:none; }
.team-canvas.grabbing, .team-canvas.grabbing .gen-stage { cursor:grabbing; }
.gen-toolbar { display:flex; gap:6px; flex-wrap:wrap; padding:10px; position:sticky; top:0; z-index:3; background:linear-gradient(#0a1020, rgba(10,16,32,.7)); }
.gen-stage { height:min(70vh, 620px); overflow:hidden; position:relative; }
.gen-world { position:absolute; left:0; top:0; transform-origin: 0 0; will-change:transform; }
.gen-lines { position:absolute; inset:0; overflow:visible; pointer-events:none; }
.gen-lines path { fill:none; stroke:rgba(224,192,120,.45); stroke-width:1.6; }
.gen-nodes { position:absolute; inset:0; }
.gen-rail { position:absolute; left:0; top:0; width:44px; pointer-events:none; z-index:2; }
.gen-lvl { position:absolute; left:8px; font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--gold); background:rgba(8,12,22,.85); border:1px solid var(--line); border-radius:999px; padding:2px 7px; }
.gen-node { position:absolute; width:148px; min-height:92px; box-sizing:border-box; padding:10px 10px 12px; border-radius:16px; border:1px solid var(--line); background:rgba(16,24,42,.94); text-align:center; box-shadow:0 10px 24px rgba(0,0,0,.35); display:flex; flex-direction:column; align-items:center; gap:4px; }
.gen-node.root { border-color:rgba(224,192,120,.55); box-shadow:0 0 0 1px rgba(224,192,120,.2), 0 10px 24px rgba(0,0,0,.35); }
.gen-node.ok { border-color:rgba(62,224,160,.35); }
.gen-node.no { opacity:.88; }
.gen-node.live .gen-ava { box-shadow:0 0 0 2px rgba(62,224,160,.45); }
.gen-ava { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#3ee0a0,#e0c078); color:#0a0c10; display:grid; place-items:center; font-weight:800; font-size:13px; }
.gen-meta { display:flex; flex-direction:column; gap:1px; width:100%; }
.gen-meta strong { font-size:12px; line-height:1.25; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  function levelStats(rootId){
    var byRef={}; state.users.forEach(function(u){ if(u.referrer_id){ (byRef[u.referrer_id]=byRef[u.referrer_id]||[]).push(u); }});
    var stats={}; for(var i=1;i<=10;i++) stats[i]={people:0,lots:0};
    var frontier=[rootId], seen={}; seen[rootId]=1;
    for(var lvl=1;lvl<=10;lvl++){
      var nxt=[];
      frontier.forEach(function(id){
        (byRef[id]||[]).forEach(function(u){
          if(seen[u.id]) return;
          seen[u.id]=1; nxt.push(u.id); stats[lvl].people++;
          var s=snapFor(u.id,week()); if(s) stats[lvl].lots+=s.lots;
        });
      });
      frontier=nxt; if(!nxt.length) break;
    }
    return stats;
  }

  function enhance(){
    // counters, bars, charts — from flask app.js logic, inlined
    document.querySelectorAll("[data-count]").forEach(function(el){
      var target=parseFloat(el.getAttribute("data-count")); if(isNaN(target)) return;
      var decimals=parseInt(el.getAttribute("data-decimals")||"2",10);
      var t0=performance.now(), dur=800;
      function step(t){ var p=Math.min(1,(t-t0)/dur); var e=1-Math.pow(1-p,3); el.textContent= (target*e).toFixed(decimals); if(p<1) requestAnimationFrame(step); }
      requestAnimationFrame(step);
    });
    document.querySelectorAll(".bar > i[data-width]").forEach(function(el){
      var w=el.getAttribute("data-width");
      requestAnimationFrame(function(){ el.style.width=w+"%"; });
    });

      T3Tree.mount(treeEl, teamData(rid), treeOpts());
    }
    document.querySelectorAll("[data-donut]").forEach(function(canvas){
      var data; try{ data=JSON.parse(canvas.getAttribute("data-donut")||"[]"); }catch(e){return;}
      if(!data.length) return;
      var ctx=canvas.getContext("2d"), dpr=window.devicePixelRatio||1;
      var w=canvas.clientWidth||220, h=canvas.clientHeight||220;
      canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr);
      var total=data.reduce(function(s,d){return s+d.v;},0)||1, cx=w/2, cy=h/2, r=Math.min(w,h)/2-8, a=-Math.PI/2;
      data.forEach(function(d){ var sl=2*Math.PI*(d.v/total); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a,a+sl); ctx.closePath(); ctx.fillStyle=d.c; ctx.fill(); a+=sl; });
      ctx.beginPath(); ctx.arc(cx,cy,r*0.58,0,Math.PI*2); ctx.fillStyle="#0b1020"; ctx.fill();
    });
    document.querySelectorAll(".chart").forEach(function(canvas){
      var pts; try{ pts=JSON.parse(canvas.getAttribute("data-points")||"[]"); }catch(e){return;}
      if(!pts.length) return;
      var ctx=canvas.getContext("2d"), dpr=window.devicePixelRatio||1;
      var w=canvas.clientWidth||320, h=canvas.clientHeight||180;
      canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr);
      var pad=28, max=Math.max.apply(null,pts.map(function(p){return p.y;}))||1;
      ctx.clearRect(0,0,w,h); ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.lineWidth=1;
      for(var i=0;i<4;i++){ var y=pad+(h-pad*2)*i/3; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(w-8,y); ctx.stroke(); }
      ctx.beginPath();
      pts.forEach(function(p,i){
        var x=pad+(w-pad-8)*(pts.length===1?0.5:i/(pts.length-1));
        var y=h-pad-(h-pad*2)*(p.y/max);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.strokeStyle="#e0c078"; ctx.lineWidth=2.2; ctx.shadowColor="rgba(224,192,120,.45)"; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
      ctx.fillStyle="#93a0b8"; ctx.font="11px system-ui";
      pts.forEach(function(p,i){ var x=pad+(w-pad-8)*(pts.length===1?0.5:i/(pts.length-1)); ctx.fillText(p.l||"",x-18,h-8); });
    });
  }

      if(sf.myfxbook_url) state.settings.myfxbook_url=sf.myfxbook_url.value;
      var rates={}, sum=0;
      for(var i=1;i<=10;i++){ rates[i]=parseFloat(sf["rate_"+i].value||T3.RATES[i]); sum+=rates[i]; }
      state.settings.rates=rates; state.settings.network_per_lot=T3.r2(sum);
      T3.runWeek(state, T3_SEED.PREV); T3.runWeek(state, T3_SEED.WEEK);
      state.flash={cat:overRebate()?"warn":"ok", msg:t("saved")+(overRebate()?(" — "+t("warning_over_rebate")):"")};
      save(); render();
    });
    var rf=document.querySelector("form[data-register]");
    if(rf) rf.addEventListener("submit", function(e){
      e.preventDefault();
      if(!rf.consent_terms.checked||!rf.consent_privacy.checked||!rf.consent_risk.checked){ state.flash={cat:"error",msg:t("need_consent")}; render(); return; }
      var code=(rf.ref.value||"KEVIN").trim().toUpperCase();
      var referrer=state.users.find(function(u){return u.code===code;})||state.users.find(function(u){return u.is_admin;});
      var nid=state.users.reduce(function(m,u){return Math.max(m,u.id);},0)+1;
      state.users.push({id:nid,name:rf.name.value,email:rf.email.value,code:"U"+nid,referrer_id:referrer?referrer.id:1,client:"",deposit:0,is_admin:0,is_example:0,usdt_network:"BEP20",email_verified:0,show_name_to_upline:1,pu_verify_status:"pending",onboard_completed:0});
      state.pendingConfirm=nid;
      state.view="confirm"; save(); render();
    });
    var cf=document.querySelector("[data-confirm]");
    if(cf) cf.addEventListener("click", function(){
      var u=userById(+cf.getAttribute("data-confirm")); if(u) u.email_verified=1;
      state.pendingConfirm=null; state.flash={cat:"ok",msg:t("confirm_ok")}; go("login");
    });
    document.querySelectorAll("[data-onboard]").forEach(function(b){
      b.addEventListener("click", function(){
        var u=current(), k=b.getAttribute("data-onboard");
        var map={link:"onboard_link_opened",register:"onboard_registered",kyc:"onboard_kyc",account:"onboard_account_opened",deposit:"onboard_deposited"};
        if(map[k]) u[map[k]]=1; save(); render();
      });
    });
  }

  function onHash(){
    var h=(location.hash||"").replace(/^#\/?/,"");
    if(h==="logout"){ state.uid=null; state.impersonator=null; go("landing"); return; }
    if(h==="stop-impersonate"){ if(state.impersonator){ state.uid=state.impersonator; state.impersonator=null; go("admin"); } return; }
    if(h.indexOf("r/")===0){ state.pendingRef=h.slice(2); state.view="register"; render(); return; }
    if(h.indexOf("p/")===0){ state.partnerCode=h.slice(2).split("?")[0]; state.view="partner"; render(); return; }
    if(h.indexOf("register")===0){ var m=h.match(/ref=([^&]+)/); if(m) state.pendingRef=decodeURIComponent(m[1]); }
    if(VIEWS[h.split("?")[0]]) { state.view=h.split("?")[0]; if(!PUBLIC[state.view] && !state.uid) state.view="landing"; save(); render(); }
    else render();
  }
  window.addEventListener("hashchange", onHash);
  if(location.hash && location.hash.length>2) onHash();
  else render();
})();

  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  </script>
</body>
</html>
