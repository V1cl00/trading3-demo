<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>trading3 · Demo</title>
<style>
:root {
  --bg: #0b1020;
  --card: #151d33;
  --line: #253049;
  --text: #e8eef8;
  --muted: #8b9bb4;
  --gold: #d4b36a;
  --gold-2: #f0d59a;
  --green: #3dd68c;
  --red: #f07178;
  --blue: #7aa2ff;
  --warn: #e6b84d;
  --radius: 16px;
  --shadow: 0 10px 40px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, #1a2748 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, #1b1630 0%, transparent 50%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}
a { color: var(--gold); text-decoration: none; cursor: pointer; }
a:hover { color: var(--gold-2); }
button { font: inherit; }
.banner {
  background: #2a2310; color: #f0d59a; text-align: center;
  padding: 8px 16px; font-size: 13px; border-bottom: 1px solid #4a3c1a;
}
.banner.impersonate { background: #1a2a20; color: var(--green); border-color: #2a4a38; }
.banner.impersonate a { color: var(--green); }
.topbar {
  display: none; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  background: rgba(12,16,30,.92);
}
.menu-btn {
  background: #1c2640; color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-weight: 700;
}
.shell { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 36px); }
.sidebar {
  background: rgba(12, 16, 30, .92);
  border-right: 1px solid var(--line);
  padding: 20px 16px;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: calc(100vh - 36px);
}
.brand { display: flex; gap: 10px; align-items: center; color: var(--text); margin-bottom: 24px; }
.brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #d4b36a, #8a6a2e);
  color: #1a1408; font-weight: 700; display: grid; place-items: center; flex-shrink: 0;
}
nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: auto; }
nav a { color: var(--muted); padding: 8px 10px; border-radius: 8px; font-weight: 500; }
nav a:hover, nav a.on { background: #1c2640; color: var(--text); }
nav a.on { box-shadow: inset 2px 0 0 var(--gold); }
.nav-label {
  margin: 18px 10px 6px; font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}
.side-foot { border-top: 1px solid var(--line); padding-top: 14px; }
.who { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: #243050;
  display: grid; place-items: center; font-weight: 600;
}
.lang { display: flex; gap: 6px; margin: 8px 0; }
.lang a, .lang button {
  color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
  padding: 2px 8px; font-size: 12px; background: transparent; cursor: pointer;
}
.lang a.on, .lang button.on { border-color: var(--gold); color: var(--gold); }
.logout { color: var(--muted); font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer; }
.main { padding: 28px 32px 48px; max-width: 1200px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
h2 { font-size: 16px; margin: 0 0 14px; font-weight: 600; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.card.narrow { max-width: 640px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi span { color: var(--muted); font-size: 13px; display: block; }
.kpi strong { font-size: 24px; display: block; margin-top: 6px; letter-spacing: -.02em; }
.kpi small { font-size: 13px; color: var(--gold); font-weight: 500; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
.mt { margin-top: 12px; }
.tag {
  display: inline-block; font-style: normal; font-size: 10px; letter-spacing: .08em;
  border: 1px solid var(--gold); color: var(--gold); padding: 2px 6px; border-radius: 999px;
  vertical-align: middle;
}
.tag.sm { font-size: 9px; padding: 1px 5px; }
.tag.gold { background: #2a2310; }
.pill { display: inline-block; background: #1c2640; border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
.copy-row { display: flex; gap: 8px; }
.copy-row input { flex: 1; }
input, select, button, textarea { font: inherit; color: var(--text); }
input, select, textarea {
  width: 100%; background: #0e1526; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
label { display: block; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
label input, label select, label textarea { margin-top: 6px; }
.btn, button.btn, .stack > button, form.stack button[type=submit] {
  background: linear-gradient(180deg, #e0c17a, #c9a04e);
  color: #1a1408; border: 0; border-radius: 10px; padding: 10px 16px;
  font-weight: 600; cursor: pointer; display: inline-block;
}
.btn.ghost, button.ghost {
  background: transparent; color: var(--text); border: 1px solid var(--line);
}
.btn.sm, button.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.btn.danger, button.danger { color: var(--red); border-color: #5a3038; background: transparent; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.flash { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--line); background: #1c2640; }
.flash.ok { border-color: #1e4a36; background: #10281c; color: var(--green); }
.flash.error { border-color: #5a3038; background: #2a1518; color: var(--red); }
.flash.warn { border-color: #5a4a20; background: #2a2310; color: var(--warn); }
.status { display: inline-block; padding: 6px 10px; border-radius: 999px; font-weight: 600; }
.status.ok { background: #10281c; color: var(--green); }
.status.no { background: #2a1518; color: var(--red); }
.status.sm { font-size: 12px; padding: 3px 8px; font-weight: 500; }
.status.pending { background: #2a2310; color: var(--warn); }
.status.approved { background: #1a2748; color: var(--blue); }
.status.paid { background: #10281c; color: var(--green); }
.status.rejected { background: #2a1518; color: var(--red); }
.table-wrap { overflow: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.facts { padding-left: 18px; }
.tree { list-style: none; margin: 0; padding-left: 18px; border-left: 1px dashed var(--line); }
.tree-node { padding: 6px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.tree-node.root { margin-bottom: 8px; }
.search { display: flex; gap: 8px; margin-bottom: 14px; max-width: 480px; }
.rates { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 12px; }
legend { color: var(--muted); padding: 0 6px; }
.check { display: flex; align-items: center; gap: 8px; color: var(--text); }
.check input { width: auto; }
.inline-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.inline-actions input[type=text] { width: 140px; padding: 6px 8px; }
.auth-wrap { max-width: 460px; margin: 40px auto 80px; padding: 0 16px; }
.auth-top { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.auth-top .lang { margin-left: auto; }
.auth-card h1 { margin: 0 0 6px; }
.roles { display: grid; gap: 10px; margin-top: 16px; }
.role {
  text-align: left; width: 100%; background: #0e1526; border: 1px solid var(--line);
  color: var(--text); padding: 14px 16px; border-radius: 12px; cursor: pointer;
}
.role:hover { border-color: var(--gold); }
.role strong { display: block; font-size: 15px; }
.role span { color: var(--muted); font-size: 13px; font-weight: 400; }
.demo-box {
  margin-top: 18px; padding: 12px; border-radius: 10px; background: #0e1526;
  border: 1px dashed var(--line); font-size: 13px; color: var(--muted); line-height: 1.6;
}
.demo-box strong { color: var(--gold); display: block; margin-bottom: 4px; }
.footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
.scrim { display: none; }
@media (max-width: 980px) {
  .shell { grid-template-columns: 1fr; }
  .topbar { display: flex; }
  .sidebar {
    display: none; position: fixed; top: 0; left: 0; bottom: 0;
    width: min(280px, 90vw); height: 100%; z-index: 30;
  }
  body.nav-open .sidebar { display: flex; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 25; }
  .kpis, .grid-2, .rates { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .main { padding: 16px; }
  .kpis, .grid-2, .rates { grid-template-columns: 1fr; }
  .page-head h1 { font-size: 22px; }
  .auth-wrap { margin: 20px auto 40px; }
}

</style>

  function upsertSnap(clientId, period, lots, balance, equity, deposit, source) {
    clientId = (clientId || "").trim(); period = (period || "").trim();
    if (!clientId || !period) throw new Error(t("required"));
    var uid = null;

    var found = null;

    if (found) {
      found.userId = uid; found.lots = Number(lots) || 0; found.balance = balance; found.equity = equity; found.source = source;
    } else {
      state.snapshots.push({ id: state.nextId++, clientId: clientId, period: period, lots: Number(lots) || 0, balance: balance, equity: equity, userId: uid, source: source });
    }

  function parseCsv(text) {
    var lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (!lines.length) return { imported: 0, unmatched: 0, errors: 1 };
    var head = lines[0].split(",").map(function (h) { return h.trim().toLowerCase(); });
    var imported = 0, unmatched = 0, errors = 0;
    for (var i = 1; i < lines.length; i++) {
      var cols = lines[i].split(",");
      var row = {};
      head.forEach(function (h, j) { row[h] = (cols[j] || "").trim(); });
      try {
        var r = upsertSnap(row.pu_prime_client_id || row.client_id, row.period, row.lots, row.balance === "" ? null : Number(row.balance), row.equity === "" ? null : Number(row.equity), row.deposit === "" ? null : row.deposit, "csv");
        if (r.matched) imported++; else unmatched++;
      } catch (e) { errors++; }
    }
    return { imported: imported, unmatched: unmatched, errors: errors };
  }

      u2.usdtAddress = (o.usdtAddress || "").trim() || null;
      u2.usdtNetwork = (o.usdtNetwork === "TRC20" || o.usdtNetwork === "ERC20") ? o.usdtNetwork : null;
      state.snapshots.forEach(function (sn) { if (sn.clientId === u2.clientId) sn.userId = u2.id; });
      saveState(); flash(t("saved"), "ok"); return;
    }
    if (kind === "search") { state.search = fd(form).q || ""; saveState(); render(); return; }
    if (kind === "csv") {
      var text = (form.csv && form.csv.value) || "";
      var file = form.file && form.file.files && form.file.files[0];
      var apply = function (src) {
        var r = parseCsv(src);
        saveState();
        flash(t("imported_ok", { imported: r.imported, unmatched: r.unmatched, errors: r.errors }), r.errors ? "error" : "ok");
      };
      if (file && !text.trim()) {
        var reader = new FileReader();
        reader.onload = function () { apply(String(reader.result || "")); };
        reader.readAsText(file);
        return;
      }
      if (!text.trim()) return flash(t("required"), "error");
      apply(text); return;
    }
    if (kind === "manual") {
      var o2 = fd(form), clientId = (o2.clientId || "").trim();
      if (o2.userId && !clientId) {
        var uu = userById(state, Number(o2.userId));
        if (uu) clientId = uu.clientId || "";
      }
      try {
        upsertSnap(clientId, o2.period, o2.lots, o2.balance === "" ? null : Number(o2.balance), o2.equity === "" ? null : Number(o2.equity), o2.deposit === "" ? null : o2.deposit, "manual");
        saveState(); flash(t("saved"), "ok");
      } catch (err) { flash(err.message || t("required"), "error"); }
      return;
    }
    if (kind === "calc") {
      var period = (fd(form).period || "").trim();
      if (!period) return flash(t("required"), "error");
      var r = runPeriod(state, period);
      saveState();
      if (!r.ok) flash(t("no_lots"), "error");
      else flash(t("calc_done", { period: period, lines: r.lines, total: money(r.total) }), "ok");
      return;
    }
    if (kind === "payout") {
      var id = Number(form.getAttribute("data-id"));
      var action = (e.submitter && e.submitter.value) || "";
      if (!action) {
        var btn = form.querySelector("button[name=action]:focus");
        if (btn) action = btn.value;
      }
      var note = fd(form).adminNote;
      state.withdrawals.forEach(function (w) {
        if (w.id === id && (action === "approved" || action === "paid" || action === "rejected")) {
          w.status = action; w.adminNote = note || w.adminNote; w.processedAt = nowStr();
        }
      });
      saveState(); flash(t("saved"), "ok"); return;
    }
    if (kind === "settings") {
      var o3 = fd(form);
      var rates = {};
      for (var i = 1; i <= 10; i++) rates[i] = Number(o3["rate_" + i] || 0);
      state.settings = {
        puPrimeIbLink: (o3.puPrimeIbLink || "").trim(),
        minDeposit: Number(o3.minDeposit || 300),
        minPartners: Number(o3.minPartners || 2),
        houseRate: Number(o3.houseRate || 5),
        minWithdrawal: Number(o3.minWithdrawal || 10),
        rates: rates,
        ineligibleToHouse: !!o3.ineligibleToHouse
      };
      saveState(); flash(t("saved"), "ok"); return;
    }
  }
  function syncHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return;
    if (/^\/r\//i.test(h)) return;
    var page = h.replace(/^\//, "");
    if (PAGES[page] && state.uid) { state.page = page; }
  }
  document.getElementById("app").addEventListener("click", onClick);
  document.getElementById("app").addEventListener("submit", onSubmit);
  window.addEventListener("hashchange", function () { syncHash(); render(); });
  syncHash();
  render();
  window.__trading3 = {
    calculateLotCommissions: calculateLotCommissions,
    walkUpline: walkUpline,
    isEligible: isEligible,
    DEFAULT_RATES: DEFAULT_RATES,
    getState: function () { return state; },
    loginAs: loginAs,
    go: go,
    runPeriod: function (p) { var r = runPeriod(state, p); saveState(); render(); return r; },
    reset: function () { try { localStorage.removeItem(STORE); } catch (e) {} state = defaultState(); render(); }
  };

})();
</script>
</body>
</html>
